---
# Source: gitops-app/templates/service.yaml
apiVersion: v1
kind: Service

metadata:
  name: gitops-app-service
  namespace: gitops-app

spec:
  type: ClusterIP

  selector:
    app: gitops-app

  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
# Source: gitops-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-app
  namespace: gitops-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: gitops-app

  template:
    metadata:
      labels:
        app: gitops-app

    spec:
      containers:
        - name: gitops-app

          image: "gitops-app:1.1"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
