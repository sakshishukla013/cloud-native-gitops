name: CI Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/gitops-app/values.yaml'

  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run tests
        working-directory: app
        run: pytest

  docker:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        working-directory: app
        run: |
          docker build -t gitops-app:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag gitops-app:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/gitops-app:${{ github.sha }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gitops-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/gitops-app:${{ github.sha }}

      - name: Update Helm image tag
        shell: bash
        run: |
          sed -i "s/tag: .*/tag: \"${{ github.sha }}\"/" helm/gitops-app/values.yaml

      - name: Commit and push Helm update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/gitops-app/values.yaml
          git commit -m "chore: update image tag to ${{ github.sha }}" || exit 0
          git push