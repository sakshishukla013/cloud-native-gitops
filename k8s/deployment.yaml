apiVersion: apps/v1
kind: Deployment

metadata:
  name: gitops-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gitops-app

  template:
    metadata:
      labels:
        app: gitops-app

    spec:
      containers:
        - name: gitops-app
          image: gitops-app:1.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000