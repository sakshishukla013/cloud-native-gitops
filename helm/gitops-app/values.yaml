replicaCount: 3

image:
  repository: ghcr.io/sakshishukla013/gitops-app
  tag: "902ac09e679a99b1f86e07937cb79610207bec43"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 20

securityContext:
  runAsNonRoot: true
  runAsUser: 1000